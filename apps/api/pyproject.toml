[project]
name = "sia-api"
version = "0.0.0"
description = "API de SIA"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi[standard]>=0.115,<1.0",
  "pydantic-settings>=2.8,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "aiosqlite>=0.21,<1.0",
  "alembic>=1.13,<2.0",
  "redis[hiredis]>=5.0,<7.0",
  "pyjwt[crypto]>=2.8,<3.0",
  "httpx>=0.28,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.15,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.11,<1.0",
  "anyio>=4.8,<5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
