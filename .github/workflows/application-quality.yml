name: Application quality

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sia
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: sia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sia -d sia_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SIA_ENVIRONMENT: test
      SIA_TEST_POSTGRES_URL: postgresql+asyncpg://sia:test-only@localhost:5432/sia_test
      EXPEDIENTE_TEST_DATABASE_URL: postgresql+asyncpg://sia:test-only@localhost:5432/sia_test
      SEGUIMIENTO_TEST_DATABASE_URL: postgresql+asyncpg://sia:test-only@localhost:5432/sia_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Verify Alembic deployment from an empty database
        env:
          SIA_DATABASE_URL: postgresql+asyncpg://sia:test-only@localhost:5432/sia_test
        run: |
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic current
          uv run --no-sync alembic check
          uv run --no-sync python -m app.modules.identity.service --email admin@example.org --operator ci

  web-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --directory apps/api --frozen --all-groups
      - run: uv run --no-sync --directory apps/api python scripts/export_openapi.py --check
      - run: pnpm contract:check
